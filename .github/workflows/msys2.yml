name: MSYS2 Build Test

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # MSYS2's POSIX (Cygwin-based) gcc
          - name: msys-shared
            msystem: MSYS
            install: git gcc autotools base-devel
            prefix: /usr/local
            config: ''
            target: all
            check: false
          # Static build so the tests link the library directly instead of
          # loading it with dlopen()
          - name: msys-static
            msystem: MSYS
            install: git gcc autotools base-devel
            prefix: /usr/local
            config: --enable-static --disable-shared
            target: all
            check: true
          # Native MinGW-w64 gcc. Only the library is built for now, the
          # tests and examples do not yet build with MinGW.
          - name: ucrt64-shared
            msystem: UCRT64
            install: git autotools base-devel mingw-w64-ucrt-x86_64-gcc
            prefix: /ucrt64
            config: ''
            target: src/libwolfpkcs11.la
            check: false

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Disable git line ending conversion
      shell: pwsh
      run: git config --global core.autocrlf false

    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: ${{ matrix.install }}
        cache: false

#pull wolfPKCS11
    - uses: actions/checkout@v4

#setup wolfssl
    - uses: actions/checkout@v4
      with:
        repository: wolfssl/wolfssl
        path: wolfssl
    - name: wolfssl autogen
      working-directory: ./wolfssl
      run: ./autogen.sh
    - name: wolfssl configure
      working-directory: ./wolfssl
      run: |
        ./configure --prefix=${{ matrix.prefix }} --enable-cryptocb --enable-aescfb --enable-rsapss --enable-keygen \
            --enable-pwdbased --enable-scrypt --enable-md5 --disable-examples --disable-crypttests \
            C_EXTRA_FLAGS="-DWOLFSSL_PUBLIC_MP -DWC_RSA_DIRECT -DHAVE_AES_ECB -DHAVE_AES_KEYWRAP"
    - name: wolfssl make
      working-directory: ./wolfssl
      run: make
    - name: wolfssl make install
      working-directory: ./wolfssl
      run: make install

#setup wolfPKCS11
    - name: wolfpkcs11 autogen
      run: ./autogen.sh
    - name: wolfpkcs11 configure
      run: |
        ./configure ${{ matrix.config }} \
            CPPFLAGS="-I${{ matrix.prefix }}/include" LDFLAGS="-L${{ matrix.prefix }}/lib"
    - name: wolfpkcs11 make
      run: make ${{ matrix.target }}
    - name: wolfpkcs11 make check
      if: ${{ matrix.check }}
      run: make check

# capture logs on failure
    - name: Upload failure logs
      if: failure() || cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: wolfpkcs11-msys2-${{ matrix.name }}-logs
        path: |
          config.log
          test-suite.log
          tests/*.log
        retention-days: 5
